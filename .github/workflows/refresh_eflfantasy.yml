name: Refresh - EFL Fantasy

# Runs 12 minutes after refresh_cloudff.yml - see refresh_shared_odds.yml's
# comment for why these are staggered rather than run all-in-one or in
# true parallel. Also owns SportMonks' real match odds for Championship/
# League One/League Two (see scripts/import_sportmonks_match_odds.py) and
# its own follow-up fixture-probabilities pass, since that odds import
# runs after refresh_shared_odds.yml already finished.
on:
  schedule:
    - cron: "36 6 * * *"
    - cron: "36 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-eflfantasy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bumped 25 -> 45 2026-08-18: confirmed live this game's own recompute
    # is genuinely slower than the other 3, not just unlucky scheduling -
    # its real player pool (Championship + League One + League Two, ~2,000
    # active game_players) is roughly 3x any Premier League-scoped game's
    # pool, so the same 5-gameweek recompute loop (MAX_GAMEWEEKS_AHEAD,
    # refresh_all.py) does proportionally more work per run. Two solo
    # workflow_dispatch runs (no other workflow overlapping) still hit the
    # old 25-minute ceiling and got cancelled mid-step - this wasn't lock
    # contention, the work itself needs more time. See also the
    # get_or_create_algorithm_version fix in compute_projections.py from
    # the same day, which separately fixes the real lock-contention crash
    # ("statement timeout ... while updating tuple ... in relation
    # algorithm_versions") seen when this game's run DOES overlap another.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run EFL Fantasy refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: python scripts/refresh_all.py --only eflfantasy
