name: EFL Fantasy player status

# 3x/day, independent of the main refresh_data.yml pipeline (twice a
# day) - injuries/suspensions/returns can change same-day and EFL
# Fantasy's live status was never captured at all before this (see
# scripts/capture_eflfantasy_player_status.py's docstring). Deliberately
# its own lightweight workflow, not folded into refresh_all.py - it only
# touches eflfantasy_player_status + one gameweek's projections, nothing
# that needs the full daily pipeline's slower cadence.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: eflfantasy-player-status
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Capture EFL Fantasy player status and recompute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/capture_eflfantasy_player_status.py
