name: Refresh - FanTeam

# Runs 12 minutes after refresh_shared_odds.yml (see that file's own
# comment for why these are staggered rather than run all-in-one or in
# true parallel) - by 06:12/18:12 the shared odds/fixtures/probabilities
# step has had 12 minutes to finish (it observed well under a minute per
# step today), so this always sees fresh data without needing a cross-
# workflow trigger.
on:
  schedule:
    - cron: "12 6 * * *"
    - cron: "12 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-fanteam
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run FanTeam refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only fanteam
