name: Refresh - wrap-up

# Runs 12 minutes after refresh_golf.yml, last in the staggered sequence
# (see refresh_shared_odds.yml's comment for the full reasoning). Covers
# the steps that don't belong to any single game's own workflow - either
# because they span more than one game (capturing FanTeam's AND Cloud
# FF's real actuals in one pass) or because they operate generically
# over whichever games/predictions already exist with no game filter at
# all (see run_wrapup()'s own docstring in scripts/refresh_all.py).
# Scheduled last specifically so it always sees every game's freshest
# recompute from this cycle.
on:
  schedule:
    - cron: "12 7 * * *"
    - cron: "12 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-wrapup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # See refresh_dreamteam.yml's comment - bumped 25 -> 120 2026-08-18.
    # Real production cancellation seen live: cancelled at 25m17s/25m18s
    # after several steps had already completed cleanly (Error: The
    # operation was canceled) - this job was doing real, valid work when
    # its own too-tight ceiling killed it mid-run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pywebpush needed since send_accuracy_digest.py was added
        # 2026-08-21 (real push notifications, same as detect_odds_
        # swings.py/poll_golf_live_scores.py in the other workflows that
        # already install it) - missed here at the time, so every wrapup
        # run since has failed on this step with ModuleNotFoundError.
        # playwright added 2026-08-27 for scrape_dreamteamtonic_fixture_
        # ticker.py - that page is a client-rendered SPA (confirmed live -
        # the real fixture-ticker table doesn't exist until React builds
        # it), so a plain HTTP fetch can't see it, unlike this project's
        # other scrapers.
        run: |
          pip install psycopg2-binary pywebpush playwright
          playwright install --with-deps chromium

      - name: Run cross-game wrap-up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only wrapup
