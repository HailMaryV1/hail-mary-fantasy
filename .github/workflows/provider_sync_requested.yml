name: Provider squad sync (Sync Now)

# The "check for a pending Sync Now click" half of Auto Import My Squad
# (see migration 0071 and scripts/sync_provider_squads.py). Was every 5
# minutes; moved to the same 90-minute cadence as provider_sync_scheduled.
# yml (see that file's comment for the real Actions-minutes accounting
# behind that number - a private repo's 2,000 min/month budget, plus a
# real incident where the previous 5-minute + 20-minute combined schedule
# appears to have burned through it, silently stalling both workflows'
# actual `schedule` triggers for over an hour). A "Sync Now" click
# (frontend/src/app/squads/actions.ts's requestProviderSync - it only
# ever sets sync_requested_at, never touches a credential itself) can now
# take up to ~90 minutes to be picked up automatically; the Actions tab's
# manual "Run workflow" button still triggers an immediate pickup in the
# meantime. --requested-only keeps each tick cheap when nothing is
# pending - one indexed DB lookup, no provider login (see sync_fanteam's
# own early-exit guard) - though the checkout/setup/dependency-install
# steps below still run and cost their own Actions minutes regardless.
on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch: {}

# Shared with provider_sync_scheduled.yml (same group name) - both
# workflows call sync_provider_squads.py against overlapping
# provider_squad_links rows with no other locking, so their ticks can
# otherwise land at the same time. cancel-in-progress is false: a run
# already logging into a provider should finish (and release its
# login/DB transaction) rather than being killed mid-sync - the next
# trigger just waits its turn instead.
concurrency:
  group: provider-squad-sync
  cancel-in-progress: false

jobs:
  sync-requested:
    runs-on: ubuntu-latest
    # Near-instant on the common early-exit case; real logins/scrapes
    # should still finish well inside this. Deliberately tighter than
    # provider_sync_scheduled.yml's timeout - if that job is occupying the
    # shared concurrency group, this bounds how much longer a queued Sync
    # Now tick has to wait before the group frees up again (though the
    # durable sync_requested_at flag, not this timeout, is what actually
    # guarantees the request is never lost - see provider_sync_scheduled.yml).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install psycopg2-binary cryptography playwright
          playwright install --with-deps chromium

      - name: Sync any requested squads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_SECRETS_KEY: ${{ secrets.PROVIDER_SECRETS_KEY }}
        run: python scripts/sync_provider_squads.py --requested-only

      # Only exists when discover_my_teams raised (see sync_provider_squads.py's
      # discovery-failure catch block) - a screenshot + full HTML of whatever
      # FanTeam's app actually rendered after token injection, so a "MY ENTRIES
      # nav link not found" failure is debuggable instead of a bare error string.
      - name: Upload FanTeam debug artifacts (on discovery failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanteam-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: fanteam_debug/
          if-no-files-found: ignore
          retention-days: 7
