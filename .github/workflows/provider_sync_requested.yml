name: Provider squad sync (Sync Now)

# The "Sync Now" half of Auto Import My Squad (see migration 0071 and
# scripts/sync_provider_squads.py) - NOT on any schedule at all.
# requestProviderSync (frontend/src/app/squads/actions.ts) sets
# sync_requested_at (durable, in case the call below ever fails) AND
# calls GitHub's REST API to dispatch this workflow immediately -
# github.com/.../actions/workflows/provider_sync_requested.yml/dispatches,
# authenticated with a repo-scoped PAT in GITHUB_ACTIONS_TOKEN (a Vercel
# env var, set by the account owner - this workflow has no way to
# generate that token itself). A real 5-minute/20-minute-then-90-minute
# polling cadence here was tried first and abandoned: a click's own
# request only ever gets picked up on the NEXT tick regardless of how
# short the interval is, which is exactly the "why did nothing happen"
# friction that prompted this - direct dispatch means a click starts a
# real run within seconds, genuinely zero Actions minutes spent between
# clicks. --requested-only still guards the actual sync/login logic
# (never runs a provider login on a manual `Run workflow` retrigger with
# nothing genuinely pending), it's just no longer covering for an absent
# trigger.
on:
  workflow_dispatch: {}

# Shared with provider_sync_scheduled.yml (same group name) - both
# workflows call sync_provider_squads.py against overlapping
# provider_squad_links rows with no other locking, so a dispatched run
# and the periodic sweep can otherwise land at the same time.
# cancel-in-progress is false: a run already logging into a provider
# should finish (and release its login/DB transaction) rather than being
# killed mid-sync - the next trigger just waits its turn instead.
concurrency:
  group: provider-squad-sync
  cancel-in-progress: false

jobs:
  sync-requested:
    runs-on: ubuntu-latest
    # Near-instant on the common early-exit case; real logins/scrapes
    # should still finish well inside this. Deliberately tighter than
    # provider_sync_scheduled.yml's timeout - if that job is occupying the
    # shared concurrency group, this bounds how much longer a queued Sync
    # Now tick has to wait before the group frees up again (though the
    # durable sync_requested_at flag, not this timeout, is what actually
    # guarantees the request is never lost - see provider_sync_scheduled.yml).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install psycopg2-binary cryptography playwright
          playwright install --with-deps chromium

      - name: Sync any requested squads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_SECRETS_KEY: ${{ secrets.PROVIDER_SECRETS_KEY }}
        run: python scripts/sync_provider_squads.py --requested-only

      # Only exists when discover_my_teams raised (see sync_provider_squads.py's
      # discovery-failure catch block) - a screenshot + full HTML of whatever
      # FanTeam's app actually rendered after token injection, so a "MY ENTRIES
      # nav link not found" failure is debuggable instead of a bare error string.
      - name: Upload FanTeam debug artifacts (on discovery failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanteam-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: fanteam_debug/
          if-no-files-found: ignore
          retention-days: 7
