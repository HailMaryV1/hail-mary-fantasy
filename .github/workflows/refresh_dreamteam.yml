name: Refresh - Dream Team

# Runs 12 minutes after refresh_eflfantasy.yml - see refresh_shared_odds.yml's
# comment for why these are staggered rather than run all-in-one or in
# true parallel.
on:
  schedule:
    - cron: "48 6 * * *"
    - cron: "48 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-dreamteam
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bumped from 15 (2026-08-17) - a clean solo run legitimately took
    # 13m31s, leaving almost no headroom; refresh_cloudff's own solo run
    # was killed by the 15-minute ceiling mid-recompute with no error of
    # its own (Error: The operation was canceled) - same fix applied
    # uniformly to every refresh_*.yml, same reasoning as
    # refresh_shared_odds.yml's own earlier 30->55 bump.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run Dream Team refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only dreamteam
