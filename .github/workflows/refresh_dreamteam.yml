name: Refresh - Dream Team

# Runs 12 minutes after refresh_eflfantasy.yml - see refresh_shared_odds.yml's
# comment for why these are staggered rather than run all-in-one or in
# true parallel.
on:
  schedule:
    - cron: "48 6 * * *"
    - cron: "48 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-dreamteam
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bumped 25 -> 120 2026-08-18, same change applied uniformly to every
    # refresh_*.yml. This repo is public, so GitHub Actions minutes are
    # free and unlimited here - there's no real cost trade-off to weigh
    # against a generous number. Every prior bump (30->55 shared_odds,
    # 15->25 here and elsewhere) was a guess at "long enough" that kept
    # turning out wrong as real data volume grew toward season start -
    # refresh_cloudff and refresh_eflfantasy were both killed mid-step by
    # their own timeout on solo runs with nothing else even overlapping
    # (Error: The operation was canceled, not a real script error). 120
    # minutes is comfortably inside GitHub's own 360-minute hard ceiling
    # for a single job and gives real headroom over anything observed so
    # far, so a run finishes or fails on its own merits, never gets killed
    # mid-write by an artificial clock.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run Dream Team refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only dreamteam
