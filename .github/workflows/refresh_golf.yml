name: Refresh - Golf

# Runs 12 minutes after refresh_dreamteam.yml, completing the football-
# games staggered sequence (shared odds -> FanTeam -> Cloud FF -> EFL
# Fantasy -> Dream Team -> Golf) - see refresh_shared_odds.yml's comment
# for why these are staggered rather than run all-in-one or in true
# parallel. Golf's own data (FanTeam Golf tournaments/scores) is entirely
# independent of the football odds/fixtures above, so it doesn't
# strictly need to run last - it's simply next in the queue.
# Schedule disabled 2026-08-19 (real user request - "not got time to
# mess around with the golf, football is the urgent one"): this was
# failing every run because active_golf_tournaments()'s intentional 48h
# post-tournament tail (see its own docstring) always hits a 401 on the
# re-scrape once a tournament has locked, and refresh_all.py escalates
# that one sub-step failure into a top-level exit(1) - a real, understood
# bug (not a random flake), just not urgent enough to fix right now.
# workflow_dispatch is kept so this can still be run by hand when wanted.
on:
  workflow_dispatch: {}

concurrency:
  group: refresh-golf
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # See refresh_dreamteam.yml's comment - bumped 25 -> 120 2026-08-18.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run Golf refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only golf
