name: Provider squad sync (scheduled)

# The regular half of Auto Import My Squad (see migration 0071 and
# scripts/sync_provider_squads.py) - discovers any new real entries and
# re-syncs every linked, enabled squad on its own periodic sweep,
# independent of anyone clicking "Sync Now" (that's now instant, real
# GitHub API dispatch on click - see provider_sync_requested.yml, no
# schedule left there at all). This is the only remaining scheduled
# workflow in Auto Import My Squad, so it has the account's whole 2,000
# Actions-minutes/month private-repo budget to itself now (see
# provider_sync_requested.yml's comment for the real incident that
# happened when both workflows ran on tight, overlapping schedules).
# Every 3 hours - matches FanTeam's own ~3h token lifetime (see
# provider_fanteam_scoutgg.py's module docstring), so this sweep never
# goes more than one token cycle without a chance to catch a real
# provider-side change (a transfer or captain swap made directly on
# FanTeam's site, never touching Hail Mary at all) - and divides evenly
# into a day (8 runs/day) so it's a single plain cron line.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

# Shared with provider_sync_requested.yml (same group name) - see that
# file's comment for why. cancel-in-progress: false so a requested sync
# already in flight is never killed by this workflow's own tick.
concurrency:
  group: provider-squad-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # If a dispatched Sync Now run is queued behind this one in the
    # shared concurrency group (see below), this timeout is what bounds
    # its worst-case wait - GitHub force-cancels a hung run after 15
    # minutes and the group frees up. Deliberately tighter than the
    # 3-hour cron interval, with headroom for a multi-squad sweep as
    # real linked-squad volume grows.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install psycopg2-binary cryptography playwright
          playwright install --with-deps chromium

      - name: Sync provider squads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROVIDER_SECRETS_KEY: ${{ secrets.PROVIDER_SECRETS_KEY }}
        run: python scripts/sync_provider_squads.py

      # Only exists when discover_my_teams raised (see sync_provider_squads.py's
      # discovery-failure catch block) - a screenshot + full HTML of whatever
      # FanTeam's app actually rendered after token injection, so a "MY ENTRIES
      # nav link not found" failure is debuggable instead of a bare error string.
      - name: Upload FanTeam debug artifacts (on discovery failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanteam-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: fanteam_debug/
          if-no-files-found: ignore
          retention-days: 7
