name: Refresh data

# Twice a day, every day - keeps FanTeam prices/lineup/status and odds
# fresh without manual intervention (see scripts/refresh_all.py for what
# actually runs). Also runnable on demand from the Actions tab for an
# extra refresh right before a squad-lock deadline.
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

# A manual dispatch (e.g. right before a squad-lock deadline, per the
# comment above) can otherwise land mid-flight of a scheduled run -
# refresh_all.py's per-step DB transactions shouldn't be interleaved with
# a second full pipeline run. cancel-in-progress: false so an in-flight
# run finishes rather than being torn mid-commit; the next trigger waits.
concurrency:
  group: refresh-data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 19 sequential steps incl. up to 5-gameweek recomputes for 2 games -
    # generous headroom over typical run time, far under the 12h gap
    # between scheduled runs. No GitHub Actions run history was available
    # to measure real durations when this was chosen - revisit once it is.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run refresh pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: python scripts/refresh_all.py
