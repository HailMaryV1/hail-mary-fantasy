name: Refresh - Cloud FF

# Runs 12 minutes after refresh_fanteam.yml - see refresh_shared_odds.yml's
# comment for why these are staggered rather than run all-in-one or in
# true parallel.
on:
  schedule:
    - cron: "24 6 * * *"
    - cron: "24 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-cloudff
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # See refresh_dreamteam.yml's comment - bumped 25 -> 120 2026-08-18.
    # This workflow's own solo run was previously killed mid-recompute by
    # a too-tight ceiling with no error of its own; no need to keep
    # guessing at a "safe enough" number on a public repo with unlimited
    # free Actions minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run Cloud FF refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/refresh_all.py --only cloudff
