name: Odds refresh requested

# Runs scripts/refresh_odds_for_game.py on demand - dispatched by
# frontend-v2's dispatchOddsRefresh server action (the "Update Odds"
# button on each game's page). Same workflow_dispatch pattern as
# golf_compute_requested.yml/provider_sync_requested.yml - a one-shot
# action the user triggers themselves, not a recurring job.
on:
  workflow_dispatch:
    inputs:
      game_slug:
        description: "Game slug to refresh odds and recompute projections for"
        required: true

concurrency:
  group: odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Refresh odds and recompute projections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: python scripts/refresh_odds_for_game.py "${{ github.event.inputs.game_slug }}"
