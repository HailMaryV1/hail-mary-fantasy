name: FFScout player status

# 2026-08-19 user request: close the "zero live signal at all" gap for
# Dream Team and Cloud FF (compute_projections.py's fetch_live_status()
# has always hard-returned {} for them) by scraping fantasyfootballscout.
# co.uk/team-news, a real Premier League team-news page. Team news only
# updates after press conferences (Thu PM-Fri evening, per the user's own
# guidance) - 3x/day the rest of the week is plenty, hourly Thu/Fri
# catches the deadline crunch without hammering the page needlessly the
# other 5 days. First day-of-week-conditional cron in this repo - both
# lines below are standard 5-field cron GitHub Actions already supports,
# no new tooling. Times are UTC and will drift ~1hr off real UK local
# time across the BST/GMT boundary - not worth solving here.
#
# Deliberately its own lightweight workflow, not folded into
# refresh_all.py's SECTIONS (same precedent as eflfantasy_player_
# status.yml) - this one recomputes 3 games' worth of upcoming gameweeks
# per run (scripts/capture_ffscout_player_status.py recomputes just the
# NEAREST upcoming gameweek for dreamteam/fanteam/cloudff - see that
# script's own docstring for why not the full 5-gameweek lookahead),
# which doesn't map onto today's per-game section boundaries.
#
# Cron times deliberately avoid 06:00-07:15 and 18:00-19:15 UTC - the
# regular twice-daily pipeline (refresh_shared_odds.yml through refresh_
# wrapup.yml) runs its own dreamteam/fanteam/cloudff recomputes in
# exactly those windows. Real incident 2026-08-19: this workflow's first
# scheduled run (then still recomputing all 5 upcoming gameweeks per
# game) got cancelled at its 30-minute timeout; while investigating,
# real overlapping cron times were also found and fixed here even though
# that specific incident's own Dream Team failure turned out to be
# unrelated (different, non-overlapping time window) - avoiding the
# collision risk that DOES exist is still the right call, same
# concurrent-write-under-load concern refresh_all.py's own docstring
# already documents as the reason the pipeline was staggered in the
# first place.
on:
  schedule:
    - cron: "0 9,15,21 * * 0,1,2,3,6"     # 3x/day Sun/Mon/Tue/Wed/Sat (UTC)
    - cron: "0 8-17,20-22 * * 4,5"        # hourly Thu/Fri, skipping the pipeline's own 06-07/18-19 windows
  workflow_dispatch: {}

concurrency:
  group: ffscout-player-status
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 psycopg2-binary

      - name: Capture FFScout team news and recompute Dream Team/FanTeam/Cloud FF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/capture_ffscout_player_status.py

      # 2026-08-20 user request: real injury type/description + expected
      # return date, feeding the same ffscout_player_status table under
      # source='ffscout_injuries' (migration 0127) - no recompute step of
      # its own needed. detail/expected_return_date are read live by the
      # game_player_pool view (no precomputed/stored score depends on
      # them); any out/doubt/banned status this step captures rides on
      # the NEXT run's own team-news recompute above, same eventually-
      # consistent model already used for the team-news source itself.
      - name: Capture FFScout injury detail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/capture_ffscout_injury_detail.py
